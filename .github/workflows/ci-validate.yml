name: CI Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate HTML & Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bloqueante: toda prueba en tests/*.mjs. El bucle es a propósito — con
      # pasos enumerados a mano, cada archivo de prueba nuevo queda fuera de CI
      # en silencio (a DeskFlow le pasó: el gate local corría reader, sync-engine
      # y catalog-warmer, y CI solo los invariantes).
      # Contexto de cada caso: docs/progress-counting-system.md
      - name: Progress tests (tests/*.mjs)
        run: |
          FAIL=0
          shopt -s nullglob
          for t in tests/*.mjs; do
            echo "── $t"
            node "$t" || FAIL=1
          done
          exit $FAIL

      - name: Verify structure
        run: |
          FAIL=0
          [ -f "index.html" ]   || { echo "❌ Missing index.html"; FAIL=1; }
          [ -f "css/styles.css" ]   || { echo "❌ Missing css/styles.css"; FAIL=1; }
          [ -f "js/player.js" ]     || { echo "❌ Missing js/player.js"; FAIL=1; }
          [ -d "songs" ]        || { echo "❌ Missing songs/"; FAIL=1; }
          [ $FAIL -eq 0 ] && echo "✅ Structure OK"
          exit $FAIL

      - name: Validate HTML
        run: |
          npx --yes html-validate@8 index.html --config '{"extends":["html-validate:recommended"],"rules":{"no-trailing-whitespace":"off","no-inline-style":"off","attr-quotes":"off","require-sri":"off"}}' || true
          echo "✅ HTML validated (warnings only)"

      - name: Verify song catalog
        run: |
          echo "🎵 Checking song catalog..."
          SONGS=$(find songs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "  Found $SONGS song(s)"
          for dir in songs/*/; do
            [ -f "${dir}data.js" ] || { echo "  ⚠️  ${dir} missing data.js"; }
          done
          echo "✅ Catalog check done"
